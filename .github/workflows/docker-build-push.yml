name: Build and Push Docker Images

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  # Cho phép chạy thủ công từ GitHub UI
  workflow_dispatch:
    inputs:
      version:
        description: 'Image version tag (e.g., 1.0.0)'
        required: false
        default: 'latest'

env:
  # Thay đổi thông tin này thành Docker Hub username của bạn
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
  DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to Docker Hub
      if: github.event_name != 'pull_request'
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Extract metadata
      id: meta
      run: |
        if [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ github.event.inputs.version }}" ]]; then
          echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
        elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
        else
          echo "VERSION=latest" >> $GITHUB_OUTPUT
        fi

    # Build và push PHP image
    - name: Build and push PHP image
      uses: docker/build-push-action@v5
      with:
        context: ./images
        file: ./images/php.Dockerfile
        push: ${{ github.event_name != 'pull_request' }}
        tags: |
          ${{ secrets.DOCKER_USERNAME }}/lemp-php:8.2
          ${{ secrets.DOCKER_USERNAME }}/lemp-php:${{ steps.meta.outputs.VERSION }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    # Build và push Nginx image
    - name: Build and push Nginx image
      uses: docker/build-push-action@v5
      with:
        context: ./images
        file: ./images/nginx.Dockerfile
        push: ${{ github.event_name != 'pull_request' }}
        tags: |
          ${{ secrets.DOCKER_USERNAME }}/lemp-nginx:latest
          ${{ secrets.DOCKER_USERNAME }}/lemp-nginx:${{ steps.meta.outputs.VERSION }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    # Build và push MySQL image
    - name: Build and push MySQL image
      uses: docker/build-push-action@v5
      with:
        context: ./images
        file: ./images/mysql.Dockerfile
        push: ${{ github.event_name != 'pull_request' }}
        tags: |
          ${{ secrets.DOCKER_USERNAME }}/lemp-mysql:8.0
          ${{ secrets.DOCKER_USERNAME }}/lemp-mysql:${{ steps.meta.outputs.VERSION }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Print summary
      if: github.event_name != 'pull_request'
      run: |
        echo "✅ Images đã được push thành công!"
        echo ""
        echo "Các images có sẵn:"
        echo "  - ${{ secrets.DOCKER_USERNAME }}/lemp-php:8.2"
        echo "  - ${{ secrets.DOCKER_USERNAME }}/lemp-nginx:latest"
        echo "  - ${{ secrets.DOCKER_USERNAME }}/lemp-mysql:8.0"
