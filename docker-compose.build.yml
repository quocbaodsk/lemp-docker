version: "3.8"

services:
  php:
    build:
      context: ./images
      dockerfile: php.Dockerfile
    container_name: devops_php
    volumes:
      - ./wwwroot:/var/www/html
      - ./config/php-fpm/custom.ini:/usr/local/etc/php/conf.d/custom.ini:ro
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "php-fpm", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  nginx:
    build:
      context: ./images
      dockerfile: nginx.Dockerfile
    container_name: devops_nginx
    ports:
      - "8000:80"
    volumes:
      - ./wwwroot:/var/www/html
      - ./logs/nginx:/var/log/nginx
      - ./config/nginx/app.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      php:
        condition: service_healthy
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
  # apache:
  #   build:
  #     context: ./images
  #     dockerfile: apache.Dockerfile
  #   container_name: devops_apache
  #   ports:
  #     - "8000:80"
  #   volumes:
  #     - ./wwwroot:/var/www/html
  #     - ./logs/apache:/usr/local/apache2/logs
  #     - ./config/apache/httpd.conf:/usr/local/apache2/conf/httpd.conf:ro
  #   depends_on:
  #     php:
  #       condition: service_healthy
  #   networks:
  #     - app_network
  #   healthcheck:
  #     test: ["CMD", "curl", "-f", "http://localhost/"]
  #     interval: 30s
  #     timeout: 10s
  #     retries: 3
  #   restart: unless-stopped
  mysql:
    build:
      context: ./images
      dockerfile: mysql.Dockerfile
    container_name: devops_mysql
    ports:
      - "3036:3306"
    volumes:
      - ./data/mysql:/var/lib/mysql
    environment:
      MYSQL_ROOT_HOST: "%"
      MYSQL_ROOT_PASSWORD: devops123
      MYSQL_ALLOW_EMPTY_PASSWORD: 0
    networks:
      - app_network
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-p${MYSQL_ROOT_PASSWORD}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  phpmyadmin:
    image: "arm64v8/phpmyadmin"
    container_name: devops_pma
    restart: unless-stopped
    ports:
      - "8001:80"
    environment:
      PMA_HOST: mysql
      UPLOAD_LIMIT: 350000K
      PMA_USER: root
      PMA_PASSWORD: devops123
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  app_network:
    driver: bridge

volumes:
  mysql_data:
